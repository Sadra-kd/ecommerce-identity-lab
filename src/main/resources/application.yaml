spring:
  application:
    name: ecommerce-identity-lab
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    generate-ddl: true
  mvc:
    problemdetails:
      enabled: true

server:
  servlet:
    context-path: /api
